
name: CloudOps CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image for testing
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cloudops-app:test

      - name: Build and publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Load SSH private key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure SSH host verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "ubuntu@$EC2_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail

          sudo docker pull "$IMAGE"

          # Replace the old container only after the new image pulls.
          sudo docker rm -f cloudops-app 2>/dev/null || true

          sudo docker run -d \
            --name cloudops-app \
            --restart unless-stopped \
            -p 80:3000 \
            "$IMAGE"

          # Wait for the application to become healthy.
          for attempt in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1/health; then
              echo
              echo "Deployment health check passed."
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed. Recent container logs:"
          sudo docker logs --tail 100 cloudops-app || true
          exit 1
          REMOTE
